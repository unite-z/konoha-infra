name: asegurar-lab
description: >-
  Comprueba que la EC2 responde por SSH. Si no responde, pide al repo privado
  del dueño del Learner Lab que lo abra y espera a que la EC2 arranque (ADR 0006).

inputs:
  host:
    description: IP o nombre de la EC2.
    required: true
  token-lab:
    description: Token que solo puede lanzar el workflow abrir-lab del repo del lab (secreto LAB_TOKEN).
    required: false
    default: ""
  repo-lab:
    description: Repo privado que abre el Learner Lab.
    required: false
    default: Makusoku/abrir-learner-lab
  espera:
    description: Segundos máximos de espera a que la EC2 responda.
    required: false
    default: "720"
  intentos:
    description: Veces que se intenta lanzar abrir-lab si la API de GitHub falla.
    required: false
    default: "5"
  pausa:
    description: Segundos entre un intento fallido de lanzar abrir-lab y el siguiente.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        HOST: ${{ inputs.host }}
        GH_TOKEN: ${{ inputs.token-lab }}
        REPO_LAB: ${{ inputs.repo-lab }}
        ESPERA: ${{ inputs.espera }}
        INTENTOS: ${{ inputs.intentos }}
        PAUSA: ${{ inputs.pausa }}
      run: |
        responde() { timeout 5 bash -c ": </dev/tcp/$HOST/22" 2>/dev/null; }

        if responde; then
          echo "La EC2 responde por SSH."
          exit 0
        fi
        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error::La EC2 no responde por SSH y falta LAB_TOKEN para abrir el Learner Lab. Ábrelo y relanza este workflow."
          exit 1
        fi

        echo "::notice::La EC2 no responde por SSH: se abre el Learner Lab desde $REPO_LAB."
        # API REST directa: `gh workflow run` consulta la rama por defecto y LAB_TOKEN solo tiene permiso de Actions.
        # La API a veces responde con un error vacío («unexpected end of JSON input», 05/11/2026): se reintenta
        # y se deja en el log el código HTTP de cada fallo para saber la causa.
        lanzar() { gh api -X POST "repos/$REPO_LAB/actions/workflows/abrir-lab.yml/dispatches" -f ref=main --include 2>&1; }
        for (( intento = 1; intento <= INTENTOS; intento++ )); do
          if salida=$(lanzar); then
            echo "abrir-lab lanzado (intento $intento de $INTENTOS)."
            break
          fi
          estado=$(printf '%s\n' "$salida" | grep -m1 -E '^HTTP/' || true)
          detalle=$(printf '%s\n' "$salida" | tail -n 1)
          echo "::warning::No se pudo lanzar abrir-lab (intento $intento de $INTENTOS): ${estado:-sin respuesta HTTP} · $detalle"
          if (( intento == INTENTOS )); then
            echo "::error::La API de GitHub no lanzó abrir-lab tras $INTENTOS intentos. Mira https://www.githubstatus.com, abre el lab a mano o relanza este workflow."
            exit 1
          fi
          sleep "$PAUSA"
        done

        fin=$((SECONDS + ESPERA))
        until responde; do
          if (( SECONDS >= fin )); then
            echo "::error::La EC2 sigue sin responder tras ${ESPERA} s. Revisa el run de abrir-lab en $REPO_LAB o abre el lab a mano y relanza este workflow."
            exit 1
          fi
          sleep 15
        done
        # sshd acepta conexiones antes de que Docker termine de levantar los contenedores.
        sleep 30
        echo "La EC2 responde tras $SECONDS s."
