name: ci

on:
  pull_request:
    # edited: corregir el título del PR vuelve a comprobarlo sin tener que hacer push.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior del mismo PR: ahorra minutos.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cambios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.filtro.outputs.terraform }}
      compose: ${{ steps.filtro.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE" ]]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"; echo "compose=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cambios="$(git diff --name-only "$BASE"...HEAD)"
          grep -qE '^(terraform/|\.github/workflows/ci\.yml$)' <<< "$cambios" && t=true || t=false
          grep -qE '^(compose/|\.github/workflows/ci\.yml$)' <<< "$cambios" && c=true || c=false
          echo "terraform=$t" >> "$GITHUB_OUTPUT"
          echo "compose=$c" >> "$GITHUB_OUTPUT"

  higiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: título del PR y rama
        env:
          TITULO: ${{ github.event.pull_request.title }}
          RAMA: ${{ github.head_ref }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          PREFIJO_TICKET: ${{ vars.PREFIJO_TICKET || 'AV' }}
        run: .github/scripts/comprobar-pr.sh
      - name: nombres, artefactos y marcas de no fusionar
        run: .github/scripts/comprobar-higiene.sh "${{ github.event.pull_request.base.sha }}"
      - name: gitleaks en los commits del PR
        run: |
          .github/scripts/instalar-gitleaks.sh
          .bin/gitleaks git --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" .
      - name: shellcheck de los scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '.githooks/*')
          if (( ${#scripts[@]} )); then shellcheck -x "${scripts[@]}"; fi

  terraform:
    needs: cambios
    if: needs.cambios.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
      - name: formato
        run: terraform fmt -check -recursive
      - name: validación (sin credenciales ni backend)
        run: terraform init -backend=false -input=false && terraform validate
      - name: tflint
        run: |
          docker run --rm -v "$PWD:/data" -w /data --entrypoint sh \
            ghcr.io/terraform-linters/tflint:v0.64.0 -c 'tflint --init && tflint --format compact'

  compose:
    needs: cambios
    if: needs.cambios.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validar los ficheros de Compose con los .env de ejemplo
        run: |
          export KONOHA_DIR="$RUNNER_TEMP/konoha"
          for e in uat prod; do
            mkdir -p "$KONOHA_DIR/$e"
            cp "compose/$e/api.env.example" "$KONOHA_DIR/$e/api.env"
            cp "compose/$e/db.env.example" "$KONOHA_DIR/$e/db.env"
            REGISTRO_IMAGENES=ghcr.io/ejemplo API_SHA=0000 WEB_SHA=0000 \
              docker compose -f "compose/$e/docker-compose.yml" config --quiet
          done
          docker compose -f compose/edge/docker-compose.yml --env-file compose/edge/edge.env.example config --quiet
      - name: validar el Caddyfile del borde
        run: |
          docker run --rm -v "$PWD/compose/edge:/etc/caddy:ro" \
            -e DOMINIO_UAT=uat.ejemplo.sslip.io -e DOMINIO_PROD=app.ejemplo.sslip.io \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Único check obligatorio en main. Pasa si nada ha fallado; los jobs saltados cuentan como correctos.
  ci-ok:
    if: always()
    needs: [cambios, higiene, terraform, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          if [[ " $RESULTADOS " == *" failure "* || " $RESULTADOS " == *" cancelled "* ]]; then exit 1; fi
