version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker-compose
    directories: ["/compose/*"]
    schedule:
      interval: weekly
      day: monday
